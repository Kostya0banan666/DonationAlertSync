apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-alert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donation-alert
  template:
    metadata:
      labels:
        app: donation-alert
    spec:
      containers:
      - name: app
        image: your-image-here
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: donation-alert
spec:
  selector:
    app: donation-alert
  ports:
  - port: 80
    targetPort: 3000
